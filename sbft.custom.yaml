patch:
  __include: patch.yaml:/shared_patch
  # style/color_scheme: xnjk
  schema/icon: "assets/fly.ico"
  # 暂时费弃 e-emoji 的 filter
  engine/filters/@last: 
  # 定制飞天所需候选显示
  style/color_scheme: flypy_jk
  style/layout: 
    __include: style.yaml:/layout_v
  style/vertical_auto_reverse: true
  style/inline_preedit: true
  style/preedit_type: preview
  # 使得符合 s;b 规则的编码唯一时自动上屏 
  # switches/@last/reset: 0
  # switches/@3/reset: 0	# 1 默认为词组模式 -- [词组, 单字]
  switches/@4/reset: 3		# 4 --  [隐藏, 有理, 无理, 两者, 都不]
  speller/auto_select: true
  speller/auto_select_pattern: "^[bpmfdtnlgkhjqxzcsrywv][2398][aeuio]$"
  # speller/auto_select_pattern: "^[bpmfdtnlgkhjqxzcsrywvaeiou];[aeuio]$"
  # translator/filter_strength: 3
  # translator/enable_user_dict: false
  # translator/stop_change: false
  # extended/enable_user_dict: false