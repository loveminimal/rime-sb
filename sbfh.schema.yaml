# Rime schema settings
# encoding: utf-8

schema:
  schema_id: sbfh
  name: 声笔飞虎
  author: 
    - Jack Liu <https://aituyaa.com>
  description: |
    - 声笔飞虎，使用大写顶功的虎码
  dependencies:
    - sbyp
  icon: 'assets/tiger.ico'
  ascii_icon: 'assets/ascii.ico'

switches:
  - name: ascii_mode
    reset: 0 
    states: [ 中文, 英文 ]
  - name: zh_trad
    reset: 0
    states: [ 简体, 繁体 ]  
  - name: chaifen
    reset: 1
    states: [ 隐拆, 显拆 ]

engine:
  processors:
    - lua_processor@*patch*p_lower_first_char
    - lua_processor@*quick_symbol
    - ascii_composer
    - chord_composer
    - key_binder    
    - lua_processor@*sbxlm.popping
    - recognizer    
    - speller       
    - punctuator    
    - selector      
    - navigator     
    - express_editor
  segmentors:
    - ascii_segmentor        
    - matcher       
    - abc_segmentor      
    - affix_segmentor@sbyp
    - punct_segmentor        
    - fallback_segmentor     
  translators:
    - punct_translator        
    - table_translator
    - script_translator@sbyp
    - reverse_lookup_translator
  filters:
    - lua_filter@*patch*f_comment
    - simplifier
    - simplifier@chaifen
    - uniquifier          

simplifier:
  opencc_config: s2t.json
  option_name: zh_trad

recognizer:
  patterns:
    quick_symbol: "^;.*$" 
    sbyp: "^`[bpmfdtnlgkhjqxzcsrywv][a-z']*$"

sbyp:
  tag: sbyp
  dictionary: sbpy
  enable_user_dict: false
  enable_encoder: false
  packs:
    # - sbpy.base
  prism: sbyp
  prefix: '`'
  tips: "〔拼音反查〕"

chaifen:
  opencc_config: hu_cf.json
  option_name: chaifen
  show_in_comment: true 
  comment_format:     
    - "xform/-/ /"
  tags:     
    # - abc
    - sbyp
  tips: all   

punctuator:
  import_preset: default


speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`
  delimiter: "`"     
  # max_code_length: 4
  auto_select: true	# 四码上屏 ←true  false→ 五码顶屏
  auto_select_pattern: "^(\\w{4,6})$"
  # auto_clear: max_length # manual | auto | max_length
  popping:
    # 顶标点
    - match: ".*[^a-z0-9]"
      # accept: "[bpmfdtnlgkhjqxzcsrywv]"
      accept: "[^a-z ]"
    # 标点大写顶
    - match: ".*[a-z0-9;']"
      accept: "[^a-z0-9;' ]"


# 形码常规不适合使用并击操作
chord_composer:
  __include: patch.yaml:/shared_patch/chord_composer
  alphabet: "qazwsxedcrfvtgbyhnujmik,ol.p;/' "
  algebra:
    __include: patch.yaml:/algebra_magic
    # __include: patch.yaml:/algebra_mirror

translator:
  dictionary: sbfh             
  prism: sbfh                  
  enable_charset_filter: false     
  enable_sentence: false           
  enable_encoder: true            
  encode_commit_history: true
  enable_completion: true     
  enable_user_dict: true      
  # comment_format: "{comment}" 
  # comment_format: 
  #   - xform|.|| # 不显示补全码

key_binder:
  import_preset: default
  bindings/+:
    - { when: has_menu, accept: semicolon, send: 2 }                             
    - { when: has_menu, accept: apostrophe, send: 3 }                            
    - { when: has_menu, accept: slash, send: 4 }    
    - { when: always, accept: Control+bracketleft, toggle: zh_trad }
    - { when: always, accept: "Control+bracketright", toggle: chaifen } 
    - { when: composing, accept: Control+u, send: Return }
    - { when: composing, accept: Control+i, send: Return }
    - { when: composing, accept: Control+l, send: Return }
    - { when: always, accept: Control+u, send: '_' }
    - { when: always, accept: Control+i, send: '-' }
    - { when: always, accept: Control+o, send: '=' }