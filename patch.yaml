# 各方案共享的补丁配置
shared_patch:
  schema/icon: 'assets/pen.ico'
  schema/ascii_icon: 'assets/ascii.ico'
  engine/processors/@before 0: chord_composer
  engine/processors/@before 1: lua_processor@*quick_symbol
  engine/translators/@after last: lua_translator@*patch*t_date
  engine/filters/@before 6: lua_filter@*patch*f_auto_select
  engine/filters/@before 7: lua_filter@*patch*f_comment
  # engine/filters/@before 8: lua_filter@*patch*f_filter_non_first_word
  recognizer/patterns/quick_symbol: "^;.*$"
  sbzdy/user_dict: patch
  punctuator/half_shape/+:
    '`' : '`'
    ';' : [；]
  switches/+:
    - name: is_show_more
      reset: 1
      states: [Ⓛ, Ⓜ]
    # - name: is_show_word
    #   reset: 0
    #   states: [单字, 词语]
  # 废弃 emoji 啦 ➭ 使用临时「 飞码长词 」替换
  # emoji 表情 —— sbyp ➭ sbfm
  # ——————
  emoji/+:
    dictionary: sbfm
    prism: sbfm
    packs:
  # 使用 e 引导飞码长词，聊胜于无~
  # engine/segmentors/@after 2: affix_segmentor@sbfm_ext
  # engine/translators/@after 1: table_translator@sbfm_ext
  # recognizer/patterns/emoji: ""
  # recognizer/patterns/sbfm_ext: "^e[bpmfdtnlgkhjqxzcsrywv][a-z']*$"
  # sbfm_ext:
  #   tag: sbfm_ext
  #   prefix: e
  #   tips: "〔飞码长词〕"
  #   dictionary: sbfm.extended
  #   enable_completion: true
  #   enable_user_dict: false
  #   comment_format:
  #     # 默认显示 4 码，大于 4 码时才显示首字前两笔
  #     # - xform/([a-z]{1,3})[a-z][a-z]/$1/
  #     # 升级为逐码显示
  #     - xform/([a-z]{1})[a-z][a-z][a-z][a-z]/$1/
  #     - xform/([a-z]{1,2})[a-z][a-z][a-z]/$1/
  #     - xform/([a-z]{1,3})[a-z][a-z]/$1/
  #     - xform/([a-z]{1,4})[a-z]/$1/

  # 拼写规则
  # speller/alphabet: "bpmfdtnlgkhjqxzcsrywvaeiou0123456789;'BPMFDTNLGKHJQXZCSRYWVAEUIO"
  # speller/max_code_length: 4
  # speller/auto_clear: max_length # manual | auto | max_length | none


  # 方案内按键绑定
  key_binder/+:
    bindings/+:
      - { when: always, accept: Control+comma, select: .next }
      - { when: composing, accept: Control+k, send: Up }                           
      - { when: composing, accept: Control+j, send: Down }
      - { when: composing, accept: Control+u, send: Return }
      - { when: composing, accept: Control+i, send: Return }
      - { when: composing, accept: Control+l, send: Return }
      - { when: always, accept: Control+u, send: '_' }
      - { when: always, accept: Control+i, send: '-' }
      - { when: always, accept: Control+o, send: '=' }
      # - { when: always, accept: Control+apostrophe, send: '\' }
      # - { when: always, accept: Control+bracketleft, toggle: is_show_word }
      - { when: always, accept: Control+bracketright, toggle: is_show_more }
      - { when: always, accept: Control+backslash, toggle: zh_trad }
      - { when: always, accept: Control+apostrophe, send: Shift+Tab }
      - { when: composing, accept: Control+n, send: Shift+Tab }
      - { when: paging, accept: Control+comma, send: Page_Up }
      - { when: has_menu, accept: Control+period, send: Page_Down }

  # 并击键位「 空明码 」—— 通过开闭不同的 alphabet 启用/禁止相应的并击键位
  chord_composer:
    # 进入并击的按键，按照键盘从左到右的顺序排序
    # alphabet: "qazwsxedcrfvtgbyhnujmik,ol.p;/'7890 "
    # alphabet: "qazwsxedcrfvtgbyhnujmik,ol.p;/' "
    # alphabet: "azfv"
    # finish_chord_on_first_key_release: true
    # 并击过程中套用的式样
    prompt_format:
      # - "xform/^(.*)$/[$1]/" 
      - "xform/^(.*)$//"
    output_format:
      - "xform/^(.*)=/$1/"
      - "xform/^(.*)=$/$1/"
      - "xform/^(.*)=(.*)=$/$1$2/"
    algebra:
      # __include: /algebra_map
      # __include: /algebra_magic
      # __include: /algebra_mirror

algebra_map:
  - xform|([azfv])|$1|
  # - xform/[a]-/f/
  # - xform/[f]-/a/
  - xform/z/ⓩ/
  - xform/v/z/
  - xform/ⓩ/v/

