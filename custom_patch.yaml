shared_patch:
  schema/icon: 'assets/pen.ico'
  schema/ascii_icon: 'assets/ascii.ico'
  engine/processors/@before 0: lua_processor@*quick_symbol
  recognizer/patterns/quick_symbol: "^;.*$"
  sbzdy/user_dict: custom_sb
  punctuator/half_shape/+:
    '`' : '`'
    '\' :  、
    '/' : '/'

  # === 按键绑定 ===
  key_binder/+:
    bindings/+:
      - { when: always, accept: Control+comma, select: .next }
      - { when: composing, accept: Control+k, send: Up }                           
      - { when: composing, accept: Control+j, send: Down }
      - { when: composing, accept: Control+u, send: Return }
      - { when: composing, accept: Control+i, send: Return }
      - { when: composing, accept: Control+l, send: Return }
      - { when: always, accept: Control+u, send: '_' }
      - { when: always, accept: Control+i, send: '-' }
      - { when: always, accept: Control+o, send: '=' }

  # === 空明码并击 ===
  chord_composer:
    finish_chord_on_first_key_release: true
    # 并击过程中套用的式样
    prompt_format:
      # - "xform/^(.*)$/[$1]/" 
      - "xform/^(.*)$//"
    output_format:
      - "xform/^(.*)=/$1/"
      - "xform/^(.*)=$/$1/"
      - "xform/^(.*)=(.*)=$/$1$2/"
    # 进入并击的按键，按照键盘从左到右的顺序排序
    # alphabet: "qazwsxedcrfvtgbyhnujmik,ol.p;/'7890 "
    alphabet: "qazwsxedcrfvtgbyhnujmik,ol.p;/' "
    algebra:
      - xform/(asdf)/0/
      - xform/(jkl;)/@/
      - xform/(sdf)/7/
      - xform/(jkl)/`/
      - xform/(wer)/8/
      - xform/(uio)/~/
      - xform/(xcv)/9/
      - xform/(nm)/m/
      - xlit|;,./|FDJG|
      - xform/^([qwertasdfgzxcvb]+)$/$1=/
      - xform/^([yuiophjklFnmDJG])/=$1/
      - xform|([A-Za-z])|$1-|
      - xform/^([7890]+)$/$1=/
      - xform/(78)/`/
      - xform/(89)/~/
      - xform/(79)/@/
      - xform/(70)/*/
      - xform/(90)/_/
      - xform/(w-g-|h-o-)/W/
      - xform/(r-g-|h-u-)/*/
      - xform/(q-g-|h-p-)/Q/
      - xform/(e-g-|h-i-)/E/
      - xform/(w-e-f-|j-i-o-)/I/
      - xform/(s-e-r-|u-i-l-)/U/
