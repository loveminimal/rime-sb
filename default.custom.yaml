patch:
  schema_list:
    - schema: sbxm
    # - schema: sbfd
    # - schema: sbmd
    # - schema: sbbd
    # - schema: sbfm
    # - schema: sbfy
    - schema: sben
  switcher:
    abbreviate_options: true
    caption: "〔方案选单〕"
    fold_options: true
    option_list_separator: '／'
    hotkeys:
      - "Control+grave"
      - "Control+Shift+grave"
      - F4
      - "Control+m"
  ascii_composer:
    good_old_caps_lock: true
    switch_key:
      Shift_L: inline_ascii
      Shift_R: inline_ascii
      Control_L: commit_code
      Control_R: noop
      Caps_Lock: clear
      Eisu_toggle: clear
  # ⚡️jk
  key_binder/+:
    bindings/+:
      - { when: always, accept: Control+comma, select: .next }
      - { when: composing, accept: Control+k, send: Up }                           
      - { when: composing, accept: Control+j, send: Down }
      - { when: paging, accept: Control+comma, send: Page_Up }
      - { when: has_menu, accept: Control+period, send: Page_Down }