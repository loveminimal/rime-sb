patch:
  schema_list:
    - schema: sben
    - schema: sbfm
    - schema: sbfd
    - schema: sbfy
  switcher:
    abbreviate_options: true
    caption: "〔方案选单〕"
    fold_options: true
    option_list_separator: '／'
    hotkeys:
      - "Control+grave"
      - "Control+Shift+grave"
      - F4
      - "Control+m"
  ascii_composer:
    good_old_caps_lock: true
    # inline_ascii 在输入法的临时西文编辑区内输入字母、数字、符号、空格等，回车上屏后自动复位到中文
    # commit_text  已输入的候选文字上屏并切换至西文输入模式
    # commit_code  已输入的编码字符上屏并切换至西文输入模式
    # 设为 noop    屏蔽该切换键
    switch_key:
      Shift_L: inline_ascii
      Shift_R: inline_ascii
      Control_L: commit_code
      Control_R: noop
      Caps_Lock: clear
      Eisu_toggle: clear
  # ⚡️jk
  key_binder/+:
    bindings/+:
      - { when: always, accept: Control+comma, select: .next }
      - { when: composing, accept: Control+k, send: Up }                           
      - { when: composing, accept: Control+j, send: Down }
      - { when: paging, accept: Control+comma, send: Page_Up }
      - { when: has_menu, accept: Control+period, send: Page_Down }